name: Sync → ORION-V3!

on:
  push:
    branches: ['**']

jobs:
  sync:
    if: github.repository == 'ELPGREEN/blank-canvas-magic-040-c1c0e681'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "❌ MIRROR_TOKEN não configurado no Lovable repo."
            exit 1
          fi
          git config user.email "lovable-sync@elpgreen.dev"
          git config user.name "lovable-sync-bot"
          git remote add target "https://x-access-token:${TOKEN}@github.com/ELPGREEN/ORION-V3.git"
          git push target "HEAD:refs/heads/$GITHUB_REF_NAME" --force
          echo "✅ Sync Lovable → ORION-V3 concluído."
