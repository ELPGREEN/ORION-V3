name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  verify-secrets:
    runs-on: ubuntu-latest
    outputs:
      secrets_available: ${{ steps.check.outputs.secrets_available }}
    steps:
      - name: Check required secrets exist
        id: check
        run: |
          MISSING=0
          for s in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!s}" ]; then
              echo "::warning::Secret $s is missing. Deployment will be skipped."
              MISSING=$((MISSING+1))
            else
              echo "✓ $s is set (length: ${#s})"
            fi
          done
          if [ $MISSING -eq 0 ]; then
            echo "secrets_available=true" >> $GITHUB_OUTPUT
          else
            echo "secrets_available=false" >> $GITHUB_OUTPUT
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  build-and-deploy:
    needs: verify-secrets
    if: needs.verify-secrets.outputs.secrets_available == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Verify Vercel auth
        run: vercel whoami --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel environment (preview)
        if: github.event_name == 'pull_request'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel environment (production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify env vars present in build
        run: |
          ENV_FILE=".vercel/.env.preview.local"
          [ "${{ github.event_name }}" = "push" ] && ENV_FILE=".vercel/.env.production.local"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE not generated by vercel pull"
            exit 1
          fi
          echo "📋 Variables pulled from Vercel ($ENV_FILE):"
          grep -oE '^[A-Z_]+' "$ENV_FILE" | sort -u | sed 's/^/  - /'
          MISSING=0
          for v in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID; do
            if ! grep -q "^$v=" "$ENV_FILE"; then
              echo "::error::$v missing on Vercel. Add it at: Project → Settings → Environment Variables"
              MISSING=$((MISSING+1))
            else
              echo "✓ $v will be injected into build"
            fi
          done
          [ $MISSING -gt 0 ] && exit 1 || true

      - name: Build (preview)
        if: github.event_name == 'pull_request'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (preview)
        if: github.event_name == 'pull_request'
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
