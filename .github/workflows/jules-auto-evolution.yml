name: Jules Auto-Evolution PR

on:
  workflow_dispatch:
    inputs:
      task_branch:
        description: 'Branch name for this task'
        required: true
        type: string
        default: 'fix/jules-task'
      pr_title:
        description: 'Pull Request Title'
        required: true
        type: string
      pr_description:
        description: 'Pull Request Description (what was done)'
        required: false
        type: string
        default: 'Auto-evolution changes by Jules'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create working branch
        run: |
          echo "Creating branch: ${{ inputs.task_branch }}"
          git checkout -b "${{ inputs.task_branch }}"

      - name: Configure git
        run: |
          git config user.name "Jules-Auto-Evolution"
          git config user.email "jules@orion-ai.dev"

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ inputs.task_branch }}
          title: ${{ inputs.pr_title }}
          body: |
            ## Jules Auto-Evolution PR

            ${{ inputs.pr_description }}

            ---
            *Generated by Orion V3 Jules Auto-Evolution System*
          base: main
          reviewers: ${{ vars.GITHUB_REVIEWERS || '' }}
          labels: |
            auto-evolution
            jules
