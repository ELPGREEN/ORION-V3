name: Sync from Lovable

on:
  push:
    branches:
      - '**'  # Qualquer branch, incluindo novas

jobs:
  sync-to-orion:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout Lovable repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug - Show incoming branch
        run: |
          echo "Branch recebida do Lovable: $BRANCH_NAME"
          git branch -a
        env:
          BRANCH_NAME: ${{ github.ref_name }}

      - name: Push to ORION-V3
        env:
          TARGET_REPO: ELPGREEN/ORION-V3
          TOKEN: ${{ secrets.LOVABLE_SYNC_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git remote add orion https://x-access-token:${TOKEN}@github.com/${TARGET_REPO}.git
          git fetch orion
          
          # Verifica se a branch já existe no destino
          if git show-ref --verify --quiet refs/remotes/orion/$BRANCH; then
            echo "Branch $BRANCH já existe no ORION-V3 — atualizando..."
            git push orion "HEAD:refs/heads/$BRANCH" --force-with-lease
          else
            echo "Branch $BRANCH é NOVA — criando no ORION-V3..."
            git push orion "HEAD:refs/heads/$BRANCH"
          fi

      - name: Sync tags
        env:
          TARGET_REPO: ELPGREEN/ORION-V3
          TOKEN: ${{ secrets.LOVABLE_SYNC_TOKEN }}
        run: |
          git push orion --tags
        continue-on-error: true
