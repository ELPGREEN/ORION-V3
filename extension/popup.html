<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      min-height: 500px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #08091a;
      color: #e8eaf0;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      position: relative;
      padding: 24px 20px 20px;
      background: linear-gradient(160deg, #0c1230 0%, #0e0a24 100%);
      border-bottom: 1px solid rgba(0, 180, 212, 0.12);
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(0,180,212,0.08) 0%, transparent 70%);
      border-radius: 50%;
    }
    .header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }
    .logo-img {
      width: 40px; height: 40px;
      border-radius: 10px;
      object-fit: cover;
    }
    .header-text h1 {
      font-size: 20px;
      font-weight: 700;
      color: #e8eaf0;
      letter-spacing: 1.5px;
    }
    .header-text .tagline {
      font-size: 11px;
      color: #6b7280;
      margin-top: 2px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }
    .status-pill.active {
      background: rgba(0,180,212,0.1);
      color: #00B4D4;
      border: 1px solid rgba(0,180,212,0.2);
    }
    .status-pill.inactive {
      background: rgba(255,255,255,0.04);
      color: #555;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
    }
    .dot.on {
      background: #00B4D4;
      box-shadow: 0 0 6px rgba(0,180,212,0.5);
      animation: pulse-dot 2s infinite;
    }
    .dot.off { background: #3a3a4a; }
    @keyframes pulse-dot { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    /* Sections */
    .section {
      padding: 12px 20px;
    }
    .section-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #4a4f5c;
      margin-bottom: 8px;
      font-weight: 600;
    }

    /* Toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .toggle-row label {
      font-size: 12px;
      color: #9ca3af;
    }
    .toggle {
      position: relative;
      width: 38px; height: 20px;
      background: #2a2b3d;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .toggle.on { background: #00889e; }
    .toggle .thumb {
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      background: #e8eaf0;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    .toggle.on .thumb { transform: translateX(18px); }

    /* Capabilities */
    .cap-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      margin-bottom: 3px;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .cap-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cap-icon {
      width: 28px; height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      background: rgba(0,180,212,0.06);
    }
    .cap-name { font-size: 12px; color: #c9cdd5; }
    .cap-status {
      font-size: 9px;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .cap-status.online { background: rgba(34,197,94,0.1); color: #22c55e; }
    .cap-status.loading { background: rgba(234,179,8,0.1); color: #eab308; }
    .cap-status.offline { background: rgba(239,68,68,0.1); color: #ef4444; }
    .cap-status.unknown { background: rgba(100,116,139,0.08); color: #64748b; }

    /* Actions */
    .actions {
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0097a7, #00838f);
      color: white;
      box-shadow: 0 2px 8px rgba(0,151,167,0.2);
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,151,167,0.3); }
    .btn-secondary {
      background: rgba(255,255,255,0.04);
      color: #9ca3af;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.08); color: #e8eaf0; }

    .btn-row { display: flex; gap: 6px; }
    .btn-row .btn { flex: 1; font-size: 11px; padding: 9px 8px; }

    .btn-icon-label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Page info */
    .page-info {
      padding: 6px 20px;
      font-size: 10px;
      color: #4a4f5c;
    }
    .page-info .url {
      color: #0097a7;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 310px;
      display: block;
    }

    /* Shortcuts */
    .shortcuts {
      padding: 10px 20px;
      font-size: 10px;
      color: #3a3f4c;
      border-top: 1px solid rgba(255,255,255,0.03);
    }
    .shortcuts kbd {
      background: rgba(255,255,255,0.06);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 9px;
      color: #6b7280;
    }

    /* Footer */
    .footer {
      padding: 10px 20px;
      text-align: center;
      font-size: 9px;
      color: #2a2b3d;
      border-top: 1px solid rgba(255,255,255,0.03);
    }
    .footer a {
      color: #4a5568;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-row">
      <img src="icon128.png" alt="Orion" class="logo-img" />
      <div class="header-text">
        <h1>ORION</h1>
        <div class="tagline">Assistente Neural — v2.0</div>
      </div>
    </div>
    <div id="statusBadge" class="status-pill inactive">
      <span class="dot off" id="statusDot"></span>
      <span id="statusText">Inativo</span>
    </div>
  </div>

  <div class="toggle-row">
    <label>Wake Word ativo</label>
    <div id="wakeToggle" class="toggle on"><div class="thumb"></div></div>
  </div>

  <div class="section">
    <div class="section-label">Capacidades</div>
    <div class="cap-item">
      <div class="cap-left"><div class="cap-icon">V</div><span class="cap-name">Visão</span></div>
      <span class="cap-status unknown" id="cap-vision">—</span>
    </div>
    <div class="cap-item">
      <div class="cap-left"><div class="cap-icon">A</div><span class="cap-name">Audição</span></div>
      <span class="cap-status unknown" id="cap-hearing">—</span>
    </div>
    <div class="cap-item">
      <div class="cap-left"><div class="cap-icon">F</div><span class="cap-name">Fala</span></div>
      <span class="cap-status unknown" id="cap-speech">—</span>
    </div>
    <div class="cap-item">
      <div class="cap-left"><div class="cap-icon">R</div><span class="cap-name">Raciocínio</span></div>
      <span class="cap-status online" id="cap-reasoning">Online</span>
    </div>
    <div class="cap-item">
      <div class="cap-left"><div class="cap-icon">B</div><span class="cap-name">Biometria</span></div>
      <span class="cap-status unknown" id="cap-face">—</span>
    </div>
  </div>

  <div id="pageInfo" class="page-info" style="display:none;">
    <span>Página ativa:</span>
    <span class="url" id="pageUrl"></span>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btnOpen">Abrir Consulta Orion</button>
    <button class="btn btn-secondary" id="btnDashboard">Dashboard Neural</button>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btnSummarize"><span class="btn-icon-label">Resumir</span></button>
      <button class="btn btn-secondary" id="btnScreenshot"><span class="btn-icon-label">Captura</span></button>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btnReadAloud"><span class="btn-icon-label">Ler</span></button>
      <button class="btn btn-secondary" id="btnExtract"><span class="btn-icon-label">Extrair</span></button>
    </div>
  </div>

  <div class="shortcuts">
    <kbd>Ctrl+Shift+O</kbd> Abrir &nbsp;&middot;&nbsp; <kbd>Ctrl+Shift+L</kbd> Escuta
  </div>

  <div class="footer">
    Orion v2.0 &mdash; <a href="https://www.iasofthub.com" target="_blank">IASoft Hub</a> &middot; ELP Green Technology
  </div>

  <script src="popup.js"></script>
</body>
</html>
