<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#0ff"/>
      <stop offset="100%" style="stop-color:#0088cc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="80" fill="#050510"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#neon)" stroke-width="6" filter="url(#glow)" opacity="0.7"/>
  <!-- Mid ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#neon)" stroke-width="8" filter="url(#glow)"/>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="url(#neon)" stroke-width="4" filter="url(#glow)" opacity="0.5"/>
  <!-- Core glow -->
  <circle cx="256" cy="256" r="60" fill="#0ff" opacity="0.04"/>
</svg>
